name: Verify composition
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run render -- --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: finance-card-tour
          path: out/finance-card-tour.mp4
